<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PraRoz</title>
    <!-- Font Awesome untuk ikon media sosial -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('ki.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .register-box {
            width: 330px;
            background: rgba(35, 40, 50, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #3a3f4d;
            text-align: center;
        }

        .register-box h2 {
            background: #ffffff;
            color: #ff8c00;
            padding: 8px;
            border-radius: 5px;
            font-size: 20px;
            margin-bottom: 25px;
        }

        .register-box input {
            width: 100%;
            padding: 10px 0;
            margin-bottom: 20px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #4b5263;
            color: #ffffff;
            outline: none;
        }

        .register-box input::placeholder {
            color: #6b7280;
        }

        .btn-register {
            width: 100%;
            padding: 10px;
            background: #ff8c00;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .btn-register:hover {
            background: #e07b00;
        }

        .register-box p {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 15px;
        }

        .register-box p a {
            color: #ff8c00;
            text-decoration: none;
        }

        .register-box p a:hover {
            text-decoration: underline;
        }

        .social-icons a {
            color: #d1d5db;
            margin: 0 8px;
            font-size: 18px;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: #ff8c00;
        }
    </style>
</head>
<body>

    <div class="register-box">
        <h2>Register Here</h2>
        <form action="#" method="POST">
            <input type="text" placeholder="Name" required>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required>
            <button type="submit" class="btn-register">Register</button>
        </form>
        <p>Already have an account? <br><a href="index.html">Login</a> here</p>
        <p>Sign up with</p>
        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-google"></i></a>
            <a href="#"><i class="fab fa-skype"></i></a>
        </div>
    </div>

</body>
</html>
